<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOD 데모 · 내 운동에 맞게, 내 몸에 맞게</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F6F0;--card:#FFFFFF;--sub:#F0EADD;--acc:#9D876B;--accD:#6F5D45;--ink:#25241F;--mut:#77736B;--line:#E5DFD3;--up:#2F6B4F;--down:#A3472E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#ECE7DC;color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
#app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden}
@media (min-width:600px){#app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(37,36,31,.08)}}
.screen{padding:0 20px 120px;min-height:100vh;min-height:100dvh}
.screen.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;height:60px;margin:0 -8px}
.top h2{margin:0;font-size:17px;font-weight:700}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn:active{background:var(--sub)}
.logo{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 10px;border-radius:10px;background:var(--sub);font-weight:900;font-size:18px;letter-spacing:-.02em}
h1{font-size:27px;line-height:1.3;font-weight:900;letter-spacing:-.025em;margin:8px 0 6px}
.lead{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:12px}
.card.sub{background:var(--sub);border-color:transparent}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{display:flex;flex-direction:column;gap:8px}
.mut{color:var(--mut)}
.small{font-size:14px}
.xs{font-size:13px}
.b{font-weight:700}
.sec-title{font-size:17px;font-weight:700;margin:24px 0 10px}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;background:var(--sub);color:var(--accD);font-size:12px;font-weight:700;white-space:nowrap}
.tag.ink{background:var(--ink);color:#fff}
.tag.line{background:transparent;border:1px solid var(--line);color:var(--mut)}
.tag.up{background:#E4EFE8;color:var(--up)}
.tag.down{background:#F6E5DF;color:var(--down)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;border-radius:16px;border:0;font-weight:700;font-size:16px;width:100%;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:disabled{background:#BDB7AA}
.btn.sec{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--sub);color:var(--ink)}
.btn.sm{min-height:44px;font-size:15px;border-radius:12px;width:auto}
.link{background:none;border:0;padding:10px 4px;color:var(--accD);font-weight:700;font-size:15px;min-height:44px}
.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:12px 20px 20px;background:linear-gradient(to top,var(--bg) 75%,rgba(248,246,240,0));z-index:20;display:flex;gap:10px}
.dock .btn{flex:1}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:72px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:20}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--mut)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{stroke:var(--ink)}
.opt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:background .15s,border-color .15s,transform .1s}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{background:var(--sub);border:2px solid var(--acc);padding:11.5px}
.check{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:999px;background:var(--ink);color:#fff;display:none;align-items:center;justify-content:center}
.opt[aria-pressed="true"] .check{display:flex;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.opt .t{font-weight:700;font-size:15px;line-height:1.35}
.opt .d{font-size:13px;color:var(--mut);line-height:1.4}
.fig{background:var(--sub);border-radius:16px;display:block;width:100%;height:auto}
.fig-wrap{position:relative}
.fig-wrap .badge{position:absolute;left:10px;top:10px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .3s}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps li span.n{flex:none;width:22px;height:22px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.bar-row{display:grid;grid-template-columns:96px 1fr 48px;align-items:center;gap:10px;padding:8px 0}
.bar{height:12px;background:var(--sub);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .5s}
.bar i.low{background:var(--ink)}
.list-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.tap{width:100%;text-align:left;background:none;border:0;padding:0}
.sheet-bg{position:fixed;inset:0;background:rgba(37,36,31,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:430px;max-height:88vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:8px 20px 28px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px)}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 10px}
.modal-bg{position:fixed;inset:0;background:rgba(37,36,31,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s}
.modal{background:#fff;border-radius:22px;padding:24px;width:100%;max-width:360px}
.modal h3{margin:0 0 8px;font-size:19px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;z-index:70;max-width:380px;width:calc(100% - 40px);text-align:center;animation:up .2s}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:var(--sub);border-radius:16px}
.switch{width:52px;height:32px;border-radius:999px;border:0;background:#CFC8BA;position:relative;flex:none;transition:background .15s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:999px;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{left:23px}
input[type=range]{width:100%;accent-color:var(--ink);height:44px}
.player{background:var(--ink);color:#fff;min-height:100vh;min-height:100dvh;padding:0 20px 24px;display:flex;flex-direction:column}
.player .icon-btn{color:#fff}
.player .icon-btn:active{background:#3A3832}
.pl-prog{height:6px;background:#3A3832;border-radius:3px;overflow:hidden}
.pl-prog i{display:block;height:100%;background:var(--acc);transition:width .25s linear}
.timer{font-size:72px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.timer.warn{color:#E9D9BF;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.05)}}
.ctrl{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:18px}
.ctrl button{border:0;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff}
.ctrl .sm{width:60px;height:60px;background:#3A3832}
.ctrl .lg{width:84px;height:84px;background:var(--acc)}
.pl-fig{background:#F0EADD;border-radius:20px;display:block;width:100%;height:min(30vh,260px);max-width:none!important}
.player h1{font-size:22px!important}
.player .timer{font-size:min(64px,11vh)}
.player .ctrl{margin-top:10px}
.player .ctrl .lg{width:76px;height:76px}
.exit-link{display:block}
@media (max-height:700px){.pl-fig{height:24vh}.player .tips,.player .exit-link{display:none}.player .timer{font-size:52px}.player .ctrl .sm{width:52px;height:52px}.player .ctrl .lg{width:68px;height:68px}}
.flash{animation:flash .6s}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(157,135,107,.9)}100%{box-shadow:0 0 0 18px rgba(157,135,107,0)}}
.sport-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sport-grid .opt{align-items:flex-start;min-height:112px;justify-content:space-between;padding:16px}
.sport-grid .opt[aria-pressed="true"]{padding:15.5px}
.ring-wrap{position:relative;width:132px;height:132px;flex:none}
.ring-wrap .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-wrap .num b{font-size:36px;font-weight:900;line-height:1}
.empty{text-align:center;padding:28px 12px}
.notice{background:#FBF3E3;border:1px solid #EADCBF;border-radius:16px;padding:14px 16px;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel .opt{align-items:center;text-align:center;padding:12px 6px}
.feel .opt[aria-pressed="true"]{padding:11.5px 5.5px}
.feel .opt .check{display:none!important}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;font-weight:500;text-align:right}
</style>

<body>
<div id="app"></div>
<div id="layer"></div>
<script>
'use strict';
/* =========================================================
   WOD 데모 — 모든 점수·추천 기준은 데모 설명용 임시 규칙입니다.
   평가 동작(TESTS), 운동 동작(MOVES), 가중치(SPORT_REGIONS)는
   전문가 검토 후 이 데이터만 교체하면 되도록 분리했습니다.
   ========================================================= */

/* ---------- 기본 데이터 ---------- */
const REGIONS = {shoulder:'어깨',overhead:'머리 위 움직임',trunk:'몸통',hip:'고관절',posterior:'후면 근육군',ankle:'발목'};
const REGION_KEYS = Object.keys(REGIONS);
const SPORTS = {golf:'골프',swim:'수영',crossfit:'크로스핏',run:'러닝',strength:'근력운동',other:'기타 운동'};
// 종목별 가중 부위 (데모용 예시)
const SPORT_REGIONS = {golf:['trunk','hip','shoulder'],swim:['shoulder','overhead','trunk'],crossfit:['ankle','hip','overhead'],run:['ankle','hip','posterior'],strength:['hip','shoulder','ankle'],other:[]};
const TOOLS = {band:'밴드',roller:'폼롤러',ball:'마사지볼',mat:'매트',none:'도구 없이 진행'};
const PURPOSES = {pre:'운동 전 준비',post:'운동 후 정리'};
const MINUTES = [5,10,15,20];
const LEVEL_SCORE = {1:25,2:50,3:75,4:100}; // 데모 평가 기준
const PREP = 5, SWITCH = 5;              // 준비·좌우 전환 시간(초)
const Q_PREP = 2, Q_WORK = 5, Q_SWITCH = 2; // 빠르게 체험

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad = n => (n<10?'0':'')+n;
function fmtDate(iso,short){const d=new Date(iso);return short?`${d.getMonth()+1}.${d.getDate()}`:`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;}
function fmtDur(sec){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),s=sec%60;if(!m)return s+'초';return s?`${m}분 ${s}초`:`${m}분`;}
function mmss(sec){sec=Math.max(0,Math.ceil(sec));return Math.floor(sec/60)+':'+pad(sec%60);}
function addMonth(iso){const d=new Date(iso);const day=d.getDate();d.setMonth(d.getMonth()+1);if(d.getDate()<day)d.setDate(0);return d.toISOString();}
function daysAgo(n,h=9){const d=new Date();d.setDate(d.getDate()-n);d.setHours(h,0,0,0);return d.toISOString();}
function hasBatchim(str){const c=str.trim().slice(-1).charCodeAt(0);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0;}
const jo = (w,a,b) => w+(hasBatchim(w)?a:b);  // jo('발목','을','를')
const rn = r => REGIONS[r];
const joinR = rs => rs.map(rn).join('·');

/* ---------- 도식(일러스트) 시스템: 직접 만든 막대 인형 ---------- */
const G = 176;              // 바닥에 닿는 점의 y
const LEN = {torso:48,head:13,ua:25,fa:23,th:33,sh:32,ft:11};
const D = a => [Math.sin(a*Math.PI/180),Math.cos(a*Math.PI/180)];
const add = (p,a,l) => [p[0]+D(a)[0]*l,p[1]+D(a)[1]*l];
const angTo = (a,b) => Math.atan2(b[0]-a[0],b[1]-a[1])*180/Math.PI;
function ik(root,target,l1,l2,sign){
  const dx=target[0]-root[0],dy=target[1]-root[1];let d=Math.hypot(dx,dy);
  d=clamp(d,Math.abs(l1-l2)+0.01,l1+l2-0.01);
  const base=Math.atan2(dx,dy)*180/Math.PI;
  const off=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1))*180/Math.PI;
  const mid=add(root,base+sign*off,l1);
  return [mid,add(mid,angTo(mid,target),l2)];
}
function B(o){
  const hip=o.hip, t=o.neck?angTo(hip,o.neck):o.t, neck=o.neck||add(hip,t,LEN.torso), head=add(neck,t+(o.hd||0),LEN.head);
  const armFK=a=>{const e=add(neck,a[0],LEN.ua);return [e,add(e,a[1],LEN.fa)];};
  const arm=(ang,tgt,s)=>ang?armFK(ang):tgt?ik(neck,tgt,LEN.ua,LEN.fa,s):armFK([0,0]);
  const [eN,hN]=arm(o.aN,o.hN,o.eS??-1);
  const [eF,hF]=arm(o.aF||(o.hF?null:o.aN),o.hF||(o.hN?[o.hN[0]-4,o.hN[1]]:null),o.eS??-1);
  const legFK=l=>{const k=add(hip,l[0],LEN.th),an=add(k,l[1],LEN.sh);return [k,an,add(an,l[2]??(l[1]+90),LEN.ft)];};
  const leg=(l,f,s,toe)=>{if(l)return legFK(l);const [k,an]=ik(hip,f,LEN.th,LEN.sh,s);return [k,an,add(an,toe??90,LEN.ft)];};
  const [kN,anN,tN]=leg(o.lN,o.fN,o.kS??1,o.toeN);
  const [kF,anF,tF]=leg(o.lF||(o.fF?null:o.lN),o.fF||(o.fN?[o.fN[0]-6,o.fN[1]]:null),o.kSF??o.kS??1,o.toeF??o.toeN);
  const pts={head,neck,hip,eN,hN,eF,hF,kN,anN,tN,kF,anF,tF};
  const ex={};
  if(o.ex){for(const k in o.ex){const v=o.ex[k];ex[k]=k==='band'?v.map(x=>typeof x==='string'?pts[x]:x):v;}}
  return {k:'body',pts,bend:o.bend||0,ex};
}
const P = {
  stand:(o={})=>B(Object.assign({hip:[100,111],t:180,aN:[0,0],aF:[-4,-4],fN:[102,G],fF:[96,G]},o)),
  arms:(a,o={})=>P.stand(Object.assign({aN:[a,a],aF:[a-5,a-5]},o)),
  fold:(f,o={})=>{const t=180-f,hip=[100-f*0.14,111+f*0.03],neck=add(hip,t,LEN.torso);
    const hand=o.handsHip?[hip[0]+8,hip[1]-6]:[neck[0]+3,Math.min(G,neck[1]+47)];
    return B(Object.assign({hip,t,hN:hand,hF:[hand[0]-3,hand[1]],eS:o.handsHip?-1:1,fN:[102,G],fF:[96,G]},o));},
  supKnee:(f,o={})=>B(Object.assign({hip:[108,172],t:-90,lN:[90+f,90+f-150],lF:[90,90,180]},o,{hN:o.hN||add(add([108,172],90+f,LEN.th),0,0),eS:1})),
  kneel:(s,o={})=>{const ank=[o.ax||118,G],knee=add(ank,180-s,LEN.sh),hip=[knee[0]-LEN.th,knee[1]];
    const ba=-Math.acos(clamp((G-hip[1])/LEN.th,-1,1))*180/Math.PI;
    const wall=o.wall?ank[0]+34:null;
    const base={hip,t:o.t??172,lN:[90,-s,90],lF:[ba,-90,-90],hN:o.hN||(wall?[wall-2,hip[1]-38]:[hip[0]+10,hip[1]-4]),eS:-1};
    const ex=Object.assign({},o.ex||{});if(wall)ex.wall=wall;
    return B(Object.assign(base,o,{ex}));},
  quad:(o={})=>{const hip=o.hip||[128,143];return B(Object.assign({hip,neck:o.neck||[hip[0]-45,128],aN:[0,0],aF:[-2,-2],lN:[0,-90,-90],lF:[-3,-90,-90]},o));},
  supine:(o={})=>B(Object.assign({hip:[108,172],t:-90,fN:[134,G],kS:1,toeN:90},o)),
  seat:(o={})=>B(Object.assign({hip:[90,170],t:192,hN:[70,G],eS:-1,lN:[92,92,182]},o)),
};
function lerp(a,b,t){
  if(typeof a==='number'&&typeof b==='number')return a+(b-a)*t;
  if(a==null)return b; if(b==null)return a;
  if(Array.isArray(a))return a.map((v,i)=>lerp(v,b[i],t));
  if(typeof a==='object'){const o={};new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>o[k]=lerp(a[k],b[k],t));return o;}
  return t<.5?a:b;
}
const F = n => n.toFixed(1);
function svgBody(p,dark){
  const q=p.pts,e=p.ex||{},ink='#25241F',far='#C9BCA8';let s='';
  s+=`<line x1="12" y1="183" x2="188" y2="183" stroke="#D9D0C0" stroke-width="3" stroke-linecap="round"/>`;
  if(e.mat)s+=`<rect x="22" y="180" width="156" height="6" rx="3" fill="#CDBFA8"/>`;
  if(e.wall!=null)s+=`<rect x="${F(e.wall)}" y="28" width="7" height="155" rx="2" fill="#D9CDB9"/>`;
  if(e.roller)s+=`<circle cx="${F(e.roller[0])}" cy="${F(e.roller[1])}" r="10" fill="#BFAE95" stroke="#9D876B" stroke-width="2"/>`;
  if(e.ball)s+=`<circle cx="${F(e.ball[0])}" cy="${F(e.ball[1])}" r="6.5" fill="#9D876B"/>`;
  const pl=(arr,c,w)=>`<polyline points="${arr.map(v=>F(v[0])+','+F(v[1])).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  s+=pl([q.neck,q.eF,q.hF],far,7)+pl([q.hip,q.kF,q.anF,q.tF],far,7);
  const mx=(q.hip[0]+q.neck[0])/2,my=(q.hip[1]+q.neck[1])/2,dx=q.neck[0]-q.hip[0],dy=q.neck[1]-q.hip[1],L=Math.hypot(dx,dy)||1;
  const cx=mx+(-dy/L)*p.bend,cy=my+(dx/L)*p.bend;
  s+=`<path d="M${F(q.hip[0])} ${F(q.hip[1])} Q${F(cx)} ${F(cy)} ${F(q.neck[0])} ${F(q.neck[1])}" fill="none" stroke="${ink}" stroke-width="10" stroke-linecap="round"/>`;
  s+=pl([q.hip,q.kN,q.anN,q.tN],ink,7)+pl([q.neck,q.eN,q.hN],ink,7);
  s+=`<circle cx="${F(q.head[0])}" cy="${F(q.head[1])}" r="10" fill="${ink}"/>`;
  if(e.band)s+=`<line x1="${F(e.band[0][0])}" y1="${F(e.band[0][1])}" x2="${F(e.band[1][0])}" y2="${F(e.band[1][1])}" stroke="#9D876B" stroke-width="3" stroke-dasharray="5 3"/>`;

}
function svgTop(p){ // 위에서 본 앉은 자세 회전
  const r=p.r;let s='';
  s+=`<circle cx="100" cy="100" r="74" fill="none" stroke="#E2D8C6" stroke-width="2" stroke-dasharray="4 6"/>`;
  s+=`<rect x="66" y="92" width="68" height="28" rx="12" fill="#D9CDB9"/>`;
  s+=`<line x1="100" y1="176" x2="100" y2="150" stroke="#C9BCA8" stroke-width="6" stroke-linecap="round"/>`;
  const a=r*Math.PI/180, ex=Math.cos(a)*40, ey=Math.sin(a)*40;
  const sweep=r>=0?1:0, ax=100+Math.sin(-a)*-60, ay=100+Math.cos(a)*60;
  s+=`<path d="M100 160 A60 60 0 0 ${sweep} ${F(100-Math.sin(a)*60)} ${F(100+Math.cos(a)*60)}" fill="none" stroke="#9D876B" stroke-width="4" stroke-linecap="round"/>`;
  s+=`<line x1="${F(100-ex)}" y1="${F(100-ey)}" x2="${F(100+ex)}" y2="${F(100+ey)}" stroke="#25241F" stroke-width="14" stroke-linecap="round"/>`;
  s+=`<circle cx="100" cy="100" r="14" fill="#25241F"/>`;
  s+=`<circle cx="${F(100-Math.sin(a)*15)}" cy="${F(100+Math.cos(a)*15)}" r="4" fill="#F0EADD"/>`;
  if(p.band)s+=`<line x1="${F(100+ex)}" y1="${F(100+ey)}" x2="178" y2="40" stroke="#9D876B" stroke-width="3" stroke-dasharray="5 3"/>`;
  s+=`<text x="100" y="196" text-anchor="middle" font-size="11" fill="#77736B">위에서 본 모습</text>`;

}
function svgBack(p){ // 뒤에서 본 등 뒤 손 맞대기
  const g=p.gap,y1=96-g/2,y2=96+g/2;let s='';
  s+=`<rect x="70" y="56" width="60" height="88" rx="18" fill="#E2D8C6"/>`;
  s+=`<circle cx="100" cy="40" r="13" fill="#25241F"/>`;
  s+=`<polyline points="126,62 136,30 ${F(104)},${F(y1)}" fill="none" stroke="#25241F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`;
  s+=`<polyline points="74,66 62,118 ${F(97)},${F(y2)}" fill="none" stroke="#25241F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(g>2)s+=`<line x1="100" y1="${F(y1+5)}" x2="100" y2="${F(y2-5)}" stroke="#9D876B" stroke-width="3" stroke-dasharray="3 3"/>`;
  s+=`<rect x="78" y="144" width="18" height="34" rx="6" fill="#C9BCA8"/><rect x="104" y="144" width="18" height="34" rx="6" fill="#C9BCA8"/>`;
  s+=`<text x="100" y="196" text-anchor="middle" font-size="11" fill="#77736B">뒤에서 본 모습</text>`;
  return s;
}
function svgPose(p,label){
  const inner=p.k==='top'?svgTop(p):p.k==='back'?svgBack(p):svgBody(p);
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${label||'자세 도식'}">${inner}</svg>`;
}

/* ---------- 점수 계산 (데모 평가 기준) ---------- */
function scoreAssessment(a){
  const regions={};
  REGION_KEYS.forEach(r=>{
    const vals=TESTS.filter(t=>t.region===r).map(t=>a.answers[t.id]).filter(v=>typeof v==='number').map(v=>LEVEL_SCORE[v]);
    regions[r]=vals.length?Math.round(vals.reduce((x,y)=>x+y,0)/vals.length):null;
  });
  const ev=REGION_KEYS.filter(r=>regions[r]!=null);
  const complete=ev.length===REGION_KEYS.length;
  const overall=complete?Math.round(ev.reduce((x,r)=>x+regions[r],0)/ev.length):null;
  const answered=TESTS.filter(t=>typeof a.answers[t.id]==='number').length;
  return {regions,overall,complete,answered,evaluated:ev};
}
const sortedA = () => [...S.assessments].sort((a,b)=>new Date(a.date)-new Date(b.date));
const latestA = () => {const l=sortedA();return l[l.length-1]||null;};
const prevA = () => {const l=sortedA();return l.length>1?l[l.length-2]:null;};
const latestScores = () => {const a=latestA();return a?scoreAssessment(a).regions:null;};
function reassessDue(){const a=latestA();if(!a)return false;return Date.now()>=new Date(addMonth(a.date)).getTime();}

/* ---------- 추천 엔진 (데모용 규칙) ---------- */
function moveSec(m){return PREP+m.work*(m.sides?2:1)+(m.sides?SWITCH:0);}
function recommend(c,scores){
  const tools=c.tools.includes('none')?[]:c.tools;
  const sportRegs=SPORT_REGIONS[c.sport]||[];
  const evals=REGION_KEYS.filter(r=>scores&&scores[r]!=null).sort((a,b)=>scores[a]-scores[b]||REGION_KEYS.indexOf(a)-REGION_KEYS.indexOf(b));
  const low=evals.filter(r=>scores[r]<75).slice(0,c.sport==='other'?3:2);
  // 1) 목적 2) 보유 도구 3) 종목 관련 부위·낮은 점수 부위와 연관된 동작만 후보로
  const related=c.sport==='other'?(m=>!low.length||m.sports.includes('other')||low.includes(m.regions[0]))
    :(m=>m.sports.includes(c.sport)||sportRegs.includes(m.regions[0])||low.includes(m.regions[0]));
  const cands=MOVES.filter(m=>m.purposes.includes(c.purpose)&&m.tools.every(t=>tools.includes(t))&&related(m));
  const w={};
  REGION_KEYS.forEach(r=>{
    w[r]=(c.sport==='other'&&!evals.length)?1:0;
    if(sportRegs.includes(r))w[r]+=3;
    if(scores&&scores[r]!=null)w[r]+=(100-scores[r])/100;
    if(low.includes(r))w[r]+=2+(75-scores[r])/25;
  });
  const base=m=>w[m.regions[0]]+0.5*m.regions.slice(1).reduce((s,r)=>s+w[r],0)+(m.sports.includes(c.sport)?1.5:0);
  const budget=c.minutes*60, picked=[], cnt={};REGION_KEYS.forEach(r=>cnt[r]=0);
  let remain=budget;
  for(;;){
    let best=null,bestE=-Infinity;
    for(const m of cands){
      if(picked.includes(m)||moveSec(m)>remain)continue;              // 중복 제외·시간 제한
      const e=base(m)-2.5*cnt[m.regions[0]]-0.6*m.regions.slice(1).reduce((s,r)=>s+cnt[r],0); // 부위 쏠림 방지
      if(e>bestE+1e-9){best=m;bestE=e;}
    }
    if(!best)break;
    picked.push(best);remain-=moveSec(best);
    best.regions.forEach((r,i)=>cnt[r]+=i?0.5:1);
  }
  const moves=picked.map((m,i)=>({m,i})).sort((a,b)=>a.m.stage-b.m.stage||a.i-b.i).map(x=>x.m);
  const total=moves.reduce((s,m)=>s+moveSec(m),0);
  const why=m=>{const r=[...m.regions].sort((a,b)=>w[b]-w[a])[0];
    if(low.includes(r))return `${rn(r)} 평가 결과(${scores[r]}점)를 반영한 동작이에요.`;
    if(sportRegs.includes(r))return `${SPORTS[c.sport]}에 많이 쓰이는 ${jo(rn(r),'을','를')} 위한 동작이에요.`;
    return '부위가 한쪽에 몰리지 않도록 넣은 동작이에요.';};
  const sp=SPORTS[c.sport];let reason;
  const lowOnly=low.filter(r=>!sportRegs.includes(r)),lowIn=low.filter(r=>sportRegs.includes(r));
  if(c.sport==='other'){
    reason=low.length?`이번 평가에서 점수가 낮았던 ${jo(joinR(low),'을','를')} 중심으로 구성했어요.`:evals.length?'평가 점수가 고르게 높아 여러 부위를 균형 있게 구성했어요.':'아직 평가 결과가 없어 여러 부위를 고르게 구성했어요.';
  }else if(!evals.length){
    reason=`아직 평가 결과가 없어 ${sp}에 많이 쓰이는 ${jo(joinR(sportRegs),'을','를')} 중심으로 구성했어요. 평가를 마치면 내 점수가 반영돼요.`;
  }else{
    reason=`${sp}에 많이 쓰이는 ${joinR(sportRegs)}`;
    reason+=lowOnly.length?`${hasBatchim(rn(sportRegs[sportRegs.length-1]))?'과':'와'} 이번 평가에서 점수가 낮았던 ${jo(joinR(lowOnly),'을','를')} 중심으로 구성했어요.`:`${hasBatchim(rn(sportRegs[sportRegs.length-1]))?'을':'를'} 중심으로 구성했어요.`;
    if(lowIn.length)reason+=` 특히 ${jo(joinR(lowIn),'은','는')} 평가 점수가 낮아 비중을 높였어요.`;
  }
  const priority=low.length?low:[];
  return {moves,total,budget,low,priority,sportRegs,reason,why,short:budget-total>60,candidates:cands.length};
}
function currentRoutine(){const p=S.prefs;if(!p.sport||!p.purpose||!p.tools.length||!p.minutes)return null;return recommend(p,latestScores());}
function routineTitle(c){return `내 몸에 맞춘 ${SPORTS[c.sport]} ${c.purpose==='pre'?'준비':'정리'} 루틴`;}
function routineSub(c){return `${SPORTS[c.sport]} ${c.purpose==='pre'?'전 준비':'후 정리'} 루틴`;}

function demoData(){
  const ans=a=>Object.fromEntries(TESTS.map((t,i)=>[t.id,a[i]]));
  const assessments=[
    {id:'demo-a1',date:daysAgo(96),answers:ans([2,2,1,2,1,2,2,1,1,2]),angles:{},demo:true},
    {id:'demo-a2',date:daysAgo(65),answers:ans([3,2,2,2,2,3,2,2,2,2]),angles:{},demo:true},
    {id:'demo-a3',date:daysAgo(34),answers:ans([3,3,2,3,2,3,3,2,1,2]),angles:{t1:140},demo:true},
  ];
  const mk=(id,days,sport,purpose,tools,minutes,status,feel)=>{
    const r=recommend({sport,purpose,tools,minutes},scoreAssessment(assessments[2]).regions);
    const done=status==='complete'?r.moves.length:Math.ceil(r.moves.length/2);
    const doneMoves=r.moves.slice(0,done);
    const actual=status==='complete'?r.total:doneMoves.reduce((s,m)=>s+moveSec(m),0);
    return {id,date:daysAgo(days,7),sport,purpose,tools,minutes,quick:false,moves:r.moves.map(m=>m.id),total:r.moves.length,doneMoves:done,
      plannedSec:r.total,actualSec:actual,status,feel,regions:[...new Set(doneMoves.map(m=>m.regions[0]))],demo:true};
  };
  const sessions=[mk('demo-s1',1,'run','pre',['none'],10,'complete','적당했어요'),mk('demo-s2',3,'run','post',['mat','roller'],15,'complete','따라 하기 쉬웠어요'),mk('demo-s3',6,'strength','pre',['band'],10,'partial','어려웠어요'),mk('demo-s4',12,'run','pre',['none'],5,'complete','적당했어요')];
  return {assessments,sessions};
}
function loadDemo(){const d=demoData();S.assessments=S.assessments.filter(a=>!a.demo).concat(d.assessments);S.sessions=S.sessions.filter(s=>!s.demo).concat(d.sessions);S.onboarded=true;if(!S.prefs.sport)S.prefs.sport='run';save();}

/* ---------- 공통 조각 ---------- */
const topbar=(title,{left='back',right=''}={})=>`<div class="top"><div style="width:44px">${left==='back'?`<button class="icon-btn" data-act="back" aria-label="뒤로">${I.back}</button>`:left==='close'?`<button class="icon-btn" data-act="assessExit" aria-label="평가 나가기">${I.close}</button>`:left}</div><h2>${title}</h2><div style="width:44px;display:flex;justify-content:flex-end">${right}</div></div>`;
const navbar=()=>{const cur=ui.screen;const b=(k,l,ic)=>`<button data-act="tab" data-arg="${k}" ${cur===k?'aria-current="page"':''}>${ic}<span>${l}</span></button>`;return `<nav class="nav" aria-label="하단 메뉴">${b('home','홈',I.home)}${b('mobility','내 가동성',I.mob)}${b('records','운동 기록',I.log)}</nav>`;};
const demoTag=()=>`<span class="tag line">데모 기록</span>`;
const ruleTag=()=>`<span class="tag line">데모 평가 기준</span>`;
function delta(cur,prev){if(cur==null||prev==null)return '';const d=cur-prev;if(d>0)return `<span class="tag up" aria-label="${d}점 상승">▲ ${d}</span>`;if(d<0)return `<span class="tag down" aria-label="${-d}점 하락">▼ ${-d}</span>`;return `<span class="tag line">변화 없음</span>`;}
function ring(val,size=132,stroke=12,dark=false){const r=(size-stroke)/2,c=2*Math.PI*r,off=val==null?c:c*(1-val/100);return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${dark?'#3A3832':'#F0EADD'}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#9D876B" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" style="transition:stroke-dashoffset .6s"/></svg>`;}
function toolLabel(tools){return tools.includes('none')?'도구 없이':tools.map(t=>TOOLS[t]).join('·');}
function moveToolTag(m){if(!m.tools.length)return '<span class="tag up">매트 없이 가능</span>';return m.tools.map(t=>`<span class="tag">${TOOLS[t]}</span>`).join(' ');}
function moveTimeLabel(m){return m.sides?`좌우 각 ${m.work}초`:`${m.work}초`;}
let animId=0;
const animFig=(poses,label,cls='fig',w=200)=>{const id='a'+(++animId);ANIMS[id]=poses;return `<svg id="${id}" class="${cls}" data-anim="${id}" viewBox="0 0 200 200" role="img" aria-label="${label}" style="max-width:${w}px">${poses[0].k==='top'?svgTop(poses[0]):poses[0].k==='back'?svgBack(poses[0]):svgBody(poses[0])}</svg>`;};
let ANIMS={};

/* ---------- 화면: 홈 ---------- */
function vHome(){
  const a=latestA(),sc=a?scoreAssessment(a):null,last=[...S.sessions].sort((x,y)=>new Date(y.date)-new Date(x.date));
  const recentSport=S.prefs.sport||(last[0]&&last[0].sport);
  let h=`<div class="screen"><div class="top"><span class="logo">WOD</span><button class="icon-btn" data-act="openSettings" aria-label="설정">${I.gear}</button></div>`;

  if(!a){
    h+=`<div class="card empty" style="margin-top:16px"><div style="max-width:220px;margin:0 auto">${animFig([testPose(TESTS[7],1),testPose(TESTS[7],4)],'상체 숙이기 도식','fig')}</div>

      <p class="small mut" style="margin:0 0 16px">10가지 동작으로 가동성을 확인하면 점수가 낮은 부위를 반영한 루틴을 만들 수 있어요. 약 5분 걸려요.</p>
      <button class="btn pri" data-act="startAssess">가동성 평가 시작</button>
      <button class="link" data-act="loadDemo" style="margin-top:6px">예시 결과로 체험하기</button></div>`;
  }else{
    if(reassessDue())h+=reassessBanner();

      <div class="ring-wrap">${ring(sc.overall)}<div class="num">${sc.overall!=null?`<b>${sc.overall}</b><span class="xs mut">종합 점수</span>`:`<span class="small b" style="text-align:center">평가<br>진행 중</span>`}</div></div>
      <div class="col" style="gap:6px;min-width:0"><span class="small mut">최근 평가일</span><span class="b">${fmtDate(a.date)}</span>
      <div class="row" style="gap:6px;flex-wrap:wrap">${ruleTag()}${a.demo?demoTag():''}</div>
      ${sc.overall==null?`<span class="xs mut">전체 평가를 마치면 종합 점수를 확인할 수 있어요</span>`:''}</div></div></button>`;
    if(!reassessDue())h+=`<p class="small mut" style="margin:0 4px 12px">다음 재평가: ${fmtDate(addMonth(a.date))} · 한 달마다 변화를 비교해요</p>`;
  }
  h+=`<div class="card sub"><div class="between"><div><div class="small mut">최근 선택한 운동</div><div class="b" style="font-size:18px">${recentSport?SPORTS[recentSport]:'아직 선택하지 않았어요'}</div></div>${recentSport?`<span style="color:var(--accD)">${I.sport[recentSport]}</span>`:''}</div>
    <button class="btn pri" style="margin-top:14px" data-act="startBuilder">오늘의 맞춤 루틴 만들기</button></div>`;
  h+=`<div class="between"><p class="sec-title">최근 수행 기록</p>${last.length?'<button class="link" data-act="tab" data-arg="records">전체 보기</button>':''}</div>`;
  if(!last.length)h+=`<div class="card empty"><p class="b" style="margin:0 0 4px">아직 수행 기록이 없어요</p><p class="small mut" style="margin:0">루틴을 끝내면 날짜·시간·완료 여부가 여기에 남아요.</p></div>`;

  return h+`</div>`+navbar();
}
function reassessBanner(){return `<div class="notice" style="margin:12px 0"><p class="b" style="margin:0 0 4px">재평가할 때가 됐어요</p><p style="margin:0 0 12px">한 달 동안 움직임이 어떻게 달라졌는지 확인해 보세요.</p><button class="btn pri sm" data-act="startReassess">재평가 시작</button></div>`;}

/* ---------- 화면: 가동성 평가 ---------- */
function vAssess(){
  const d=S.draft,i=d.step,t=TESTS[i],v=d.answers[t.id],ang=d.angles[t.id];
  let h=`<div class="screen">${topbar(d.isRe?'재평가':'가동성 평가',{left:'close',right:`<span class="small b">${i+1}/10</span>`})}
  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${i+1}" aria-label="평가 진행"><i style="width:${(i+1)*10}%"></i></div>
  <div class="row" style="gap:6px;margin-top:18px;flex-wrap:wrap"><span class="tag">목표 부위 · ${rn(t.region)}</span>${t.side?`<span class="tag ink">${t.side}</span>`:''}<span class="tag line">데모 평가 기준</span></div>
  <h1 style="font-size:24px">${t.name}</h1><p class="small mut" style="margin:0 0 12px">${t.target}</p>
  <div class="fig-wrap">${animFig([testPose(t,1),testPose(t,4)],t.name+' 안내 도식','fig',430)}<span class="tag badge" style="background:#fff">데모 동작 안내</span></div>
  <div class="card" style="margin-top:12px"><p class="b" style="margin:0 0 6px">시작 자세</p><p style="margin:0 0 14px">${t.setup}</p><p class="b" style="margin:0 0 8px">수행 방법</p>
  <ol class="steps">${t.how.map((x,k)=>`<li><span class="n">${k+1}</span><span>${x}</span></li>`).join('')}</ol>
  <p class="xs mut" style="margin:12px 0 0">통증이 있거나 수행이 불편하면 무리하지 말고 이번 항목을 건너뛰세요.</p></div>
  <div class="between"><p class="sec-title">내 움직임과 가까운 범위</p>${t.angle?`<button class="btn soft sm" data-act="toggleAngle" aria-expanded="${ui.anglePanel}">${I.angle} 각도 입력</button>`:''}</div>`;
  if(ui.anglePanel&&t.angle)h+=anglePanel(t);
  h+=`<div class="opt-grid" role="group" aria-label="결과 선택">${t.levels.map((l,k)=>`<button class="opt" data-act="pickLevel" data-arg="${k+1}" aria-pressed="${v===k+1}"><span class="check">${I.check}</span>${svgPose(testPose(t,k+1),l).replace('<svg','<svg class="fig"')}<span class="t">범위 ${k+1} · ${l}</span><span class="d">${t.desc[k]}</span></button>`).join('')}</div>`;
  h+=`<div class="card sub" style="margin-top:12px" aria-live="polite">${v==='skip'?`<b>이번 항목을 건너뛰었어요.</b><br><span class="small mut">점수에 넣지 않고 미평가로 표시해요.</span>`:typeof v==='number'?`<b>선택한 결과: 범위 ${v} · ${t.levels[v-1]}</b><br><span class="small mut">데모 기준 ${LEVEL_SCORE[v]}점${ang!=null?` · 수동 입력 각도 ${ang}°`:''}</span>`:`<span class="small mut">예시 4개 중 하나를 골라 주세요.</span>`}</div>`;
  h+=`<button class="link" data-act="skipTest" style="display:block;margin:8px auto 0">이번 항목 건너뛰기</button></div>`;
  h+=`<div class="dock"><button class="btn sec" data-act="assessPrev" ${i===0?'disabled style="opacity:.4"':''}>이전 단계</button><button class="btn pri" data-act="assessNext" ${v==null?'disabled':''}>${i===9?'결과 보기':'다음 단계'}</button></div>`;
  return h;
}
function anglePanel(t){
  const a=ui.angleVal??Math.round((t.angle.min+t.angle.max)/2),lvl=angleToLevel(t,a);
  return `<div class="card" style="border:2px solid var(--acc)"><div class="between"><span class="b">각도 입력</span><span class="tag">수동 입력 예시</span></div>
  <div class="row" style="gap:12px;margin-top:8px"><div style="flex:1" id="angFig">${svgPose(t.pose(a),'입력한 각도의 자세').replace('<svg','<svg class="fig"')}</div>
  <div style="flex:1;text-align:center" id="angGauge">${gauge(a,t.angle)}</div></div>
  <label class="small b" for="angRange" style="display:block;margin-top:10px">각도 <span id="angNum">${a}</span>° → <span id="angLvl">범위 ${lvl}</span></label>
  <input id="angRange" type="range" min="${t.angle.min}" max="${t.angle.max}" step="1" value="${a}" data-input="angle">
  <p class="xs mut" style="margin:4px 0 12px">휴대폰 센서나 카메라를 쓰지 않아요. 직접 잰 각도를 슬라이더로 옮겨 적는 예시예요.</p>
  <button class="btn pri sm" data-act="applyAngle" style="width:100%">이 각도로 결과 선택</button></div>`;
}
function gauge(a,cfg){const p=(a-cfg.min)/(cfg.max-cfg.min),ang=Math.PI*(1-p),x=60+Math.cos(ang)*46,y=64-Math.sin(ang)*46;
  return `<svg viewBox="0 0 120 80" role="img" aria-label="${a}도" style="width:100%"><path d="M14 64 A46 46 0 0 1 106 64" fill="none" stroke="#F0EADD" stroke-width="10" stroke-linecap="round"/><path d="M14 64 A46 46 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="#9D876B" stroke-width="10" stroke-linecap="round"/><line x1="60" y1="64" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#25241F" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="64" r="4" fill="#25241F"/></svg><div style="font-size:30px;font-weight:900;line-height:1">${a}°</div><div class="xs mut">${cfg.min}°~${cfg.max}°</div>`;}

/* ---------- 화면: 내 가동성 ---------- */

  const sc=scoreAssessment(a),ps=p?scoreAssessment(p):null;
  if(reassessDue())h+=reassessBanner();
  h+=`<div class="card"><div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:12px">${ruleTag()}${a.demo?demoTag():''}</div><div class="row" style="gap:18px">
    <div class="ring-wrap">${ring(sc.overall)}<div class="num">${sc.overall!=null?`<b>${sc.overall}</b><span class="xs mut">/ 100</span>`:`<span class="small b">–</span>`}</div></div>
    <div class="col" style="gap:4px"><span class="small mut">종합 점수</span><span class="b">${fmtDate(a.date)}</span>
    ${sc.overall==null?'':ps&&ps.overall!=null?`<span class="small mut">지난 평가 대비</span><span>${delta(sc.overall,ps.overall)}</span>`:`<span class="xs mut">다음 평가부터 변화를 비교할 수 있어요</span>`}</div></div>
    ${sc.overall==null?`<div class="notice" style="margin-top:14px">${sc.answered?'전체 평가를 마치면 종합 점수를 확인할 수 있어요.':'평가된 항목이 없어요. 전체 평가를 마치면 종합 점수를 확인할 수 있어요.'}<button class="btn pri sm" style="margin-top:10px;width:100%" data-act="continueAssess" data-arg="${a.id}">이어서 평가하기</button></div>`:''}</div>`;
  h+=`<p class="sec-title">부위별 점수</p><div class="card" style="padding:10px 16px">`;
  const low=recommend({sport:'run',purpose:'pre',tools:['none'],minutes:5},sc.regions).low;
  REGION_KEYS.forEach(r=>{const v=sc.regions[r],pv=ps?ps.regions[r]:null;
    h+=`<div class="bar-row"><span class="small b">${rn(r)}</span><div class="bar" aria-hidden="true"><i class="${low.includes(r)?'low':''}" style="width:${v??0}%"></i></div><span class="b" style="text-align:right">${v??'<span class="xs mut">미평가</span>'}</span></div>
    ${v!=null&&ps?`<div style="margin:-4px 0 6px 106px">${pv!=null?delta(v,pv):'<span class="xs mut">지난 평가에서 미평가</span>'}</div>`:''}`;});
  h+=`</div>`;
  if(!ps)h+=`<p class="small mut" style="margin:0 4px 12px">다음 평가부터 변화를 비교할 수 있어요.</p>`;
  h+=`<div class="card sub"><p class="b" style="margin:0 0 6px">이번 루틴에서 우선 반영할 부위</p>${low.length?`<div class="row" style="gap:6px;flex-wrap:wrap">${low.map(r=>`<span class="tag ink">${rn(r)} ${sc.regions[r]}점</span>`).join('')}</div><p class="small mut" style="margin:8px 0 0">75점 미만인 부위 중 점수가 낮은 2곳을 루틴에 더 반영해요. (기타 운동은 최대 3곳)</p>`:`<p class="small mut" style="margin:0">75점 미만인 부위가 없어 운동 종목 중심으로 구성해요.</p>`}</div>`;
  h+=`<p class="sec-title">월별 점수 변화</p><div class="card">${trendChart()}</div>`;
  h+=`<p class="sec-title">평가 기록</p><div class="card" style="padding:4px 20px">${sortedA().reverse().map(x=>{const s=scoreAssessment(x);return `<button class="tap list-item" data-act="openAssessment" data-arg="${x.id}"><div style="flex:1"><div class="between"><span class="b">${fmtDate(x.date)}</span><span class="b">${s.overall!=null?s.overall+'점':'<span class="small mut">종합 점수 없음</span>'}</span></div><div class="row small mut" style="gap:6px;margin-top:2px">${s.answered}/10 항목 평가 ${x.demo?demoTag():''}</div></div><span aria-hidden="true" class="mut">›</span></button>`;}).join('')}</div>`;
  h+=`<div class="col" style="gap:10px;margin-top:16px"><button class="btn pri" data-act="startBuilder">이 결과로 루틴 만들기</button><button class="btn sec" data-act="startReassess">다시 평가하기</button>
    ${!reassessDue()?`<button class="link" data-act="startReassess" data-arg="demo">재평가 체험 (한 달을 기다리지 않고 바로)</button>`:''}</div>`;
  return h+`</div>`+navbar();
}
function trendChart(){
  const pts=sortedA().map(a=>({a,s:scoreAssessment(a).overall})).filter(x=>x.s!=null);
  if(pts.length<2)return `<p class="small mut" style="margin:0">${pts.length?'평가가 한 번뿐이에요. 다음 평가부터 변화를 비교할 수 있어요.':'종합 점수가 있는 평가가 아직 없어요.'}</p>`;
  const W=320,H=150,l=30,r=12,t=16,b=28,n=pts.length,xs=i=>l+(n===1?0:(W-l-r)*i/(n-1)),ys=v=>t+(H-t-b)*(1-v/100);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="평가별 종합 점수: ${pts.map(p=>fmtDate(p.a.date,true)+' '+p.s+'점').join(', ')}" style="width:100%;height:auto">`;
  [0,50,100].forEach(v=>s+=`<line x1="${l}" x2="${W-r}" y1="${ys(v)}" y2="${ys(v)}" stroke="#E5DFD3"/><text x="${l-6}" y="${ys(v)+4}" font-size="10" text-anchor="end" fill="#77736B">${v}</text>`);
  s+=`<polyline points="${pts.map((p,i)=>xs(i)+','+ys(p.s)).join(' ')}" fill="none" stroke="#9D876B" stroke-width="3" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${xs(i)}" cy="${ys(p.s)}" r="5" fill="${i===n-1?'#25241F':'#fff'}" stroke="#25241F" stroke-width="2"/><text x="${xs(i)}" y="${ys(p.s)-10}" font-size="12" font-weight="700" text-anchor="middle" fill="#25241F">${p.s}</text><text x="${xs(i)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#77736B">${new Date(p.a.date).getMonth()+1}월 ${new Date(p.a.date).getDate()}일</text>`;});
  return s+`</svg>${pts.some(p=>p.a.demo)?'<p class="xs mut" style="margin:6px 0 0">데모 기록이 포함돼 있어요.</p>':''}`;
}

/* ---------- 화면: 루틴 만들기 (종목 → 목적 → 도구 → 시간) ---------- */
function stepHead(n,title,sub){return `${topbar(`${n}/4`)}<div class="progress" aria-hidden="true"><i style="width:${n*25}%"></i></div><h1 style="margin-top:18px">${title}</h1><p class="lead">${sub}</p>`;}

function vPurpose(){const v=S.prefs.purpose,sp=SPORTS[S.prefs.sport];

  <div class="col" style="gap:10px" role="group" aria-label="루틴 목적">${['pre','post'].map(k=>`<button class="opt" data-act="pickPurpose" data-arg="${k}" aria-pressed="${v===k}" style="padding:18px"><span class="check">${I.check}</span><span class="t" style="font-size:18px">${PURPOSES[k]}</span><span class="d">${k==='pre'?`${sp} 전 · 움직이며 관절 범위를 넓히는 동작 위주`:`${sp} 후 · 머물며 늘리고 이완하는 동작 위주`}</span></button>`).join('')}</div></div>

function vTools(){const v=S.prefs.tools;
  return `<div class="screen">${stepHead(3,'지금 쓸 수 있는 도구는?','여러 개 고를 수 있어요. 고른 도구로 할 수 있는 동작만 추천해요.')}
  <div class="opt-grid" role="group" aria-label="도구 선택">${Object.keys(TOOLS).map(k=>`<button class="opt" data-act="pickTool" data-arg="${k}" aria-pressed="${v.includes(k)}" style="padding:16px;min-height:96px${k==='none'?';grid-column:1/-1':''}"><span class="check">${I.check}</span><span style="color:var(--accD)">${I.tool[k]}</span><span class="t">${TOOLS[k]}</span>${k==='none'?'<span class="d">선 채로 하거나 벽을 짚는 맨몸 동작만 추천해요</span>':k==='mat'?'<span class="d">바닥에 눕거나 앉는 동작이 추가돼요</span>':''}</button>`).join('')}</div></div>
  <div class="dock"><button class="btn pri" data-act="stepNext" data-arg="time" ${v.length?'':'disabled'}>다음</button></div>`;}
function vTime(){const v=S.prefs.minutes,sc=latestScores();
  return `<div class="screen">${stepHead(4,'얼마나 할까요?','준비·좌우 전환 시간을 포함한 전체 시간이에요.')}
  <div class="opt-grid" role="group" aria-label="시간 선택">${MINUTES.map(m=>{const r=recommend(Object.assign({},S.prefs,{minutes:m}),sc);return `<button class="opt" data-act="pickTime" data-arg="${m}" aria-pressed="${v===m}" style="padding:18px"><span class="check">${I.check}</span><span class="t" style="font-size:22px">${m}분</span><span class="d">${r.moves.length?`${r.moves.length}개 동작 · 실제 ${fmtDur(r.total)}`:'조건에 맞는 동작이 없어요'}</span></button>`;}).join('')}</div></div>
  <div class="dock"><button class="btn pri" data-act="makeRoutine" ${v?'':'disabled'}>루틴 만들기</button></div>`;}

/* ---------- 화면: 루틴 확인 ---------- */
function vRoutine(){
  const c=S.prefs,r=currentRoutine();
  if(!r)return `<div class="screen">${topbar('맞춤 루틴')}<p>조건을 먼저 골라 주세요.</p><button class="btn pri" data-act="startBuilder">조건 고르기</button></div>`;

  <div class="card sub"><p class="b" style="margin:0 0 4px">추천 이유</p><p style="margin:0">${r.reason}</p><p class="xs mut" style="margin:8px 0 0">데모용 임시 추천 규칙이에요. 검증된 운동 효과를 뜻하지 않아요.</p></div>`;
  if(!r.moves.length)h+=`<div class="notice">고른 도구와 목적에 맞는 동작이 없어요. 도구를 더 고르거나 목적을 바꿔 보세요.</div>`;
  else if(r.short)h+=`<div class="notice">조건에 맞는 동작이 부족해 실제 구성 시간은 <b>${fmtDur(r.total)}</b>이에요. 같은 동작을 반복해 채우지 않았어요. 도구를 더 고르거나 시간을 줄여 보세요.</div>`;
  h+=`<p class="sec-title">동작 ${r.moves.length}개</p><div class="card" style="padding:4px 16px">${r.moves.map((m,i)=>`<div class="list-item"><div style="flex:none;width:64px">${svgPose(m.poses[1],m.name).replace('<svg','<svg class="fig"')}</div><div style="flex:1;min-width:0"><div class="between" style="align-items:flex-start"><span class="b">${i+1}. ${m.name}</span><span class="small b" style="white-space:nowrap">${fmtDur(moveSec(m))}</span></div><div class="row" style="gap:6px;flex-wrap:wrap;margin:4px 0"><span class="tag">${rn(m.regions[0])}</span>${moveToolTag(m)}<span class="tag line">${moveTimeLabel(m)}</span></div><div class="xs mut">${r.why(m)}</div></div></div>`).join('')}</div>
  <div class="card between"><div><div class="b">빠르게 체험</div><div class="xs mut">동작 구성은 그대로, 동작마다 ${Q_WORK}초만 진행해요</div></div><button class="switch" role="switch" aria-checked="${S.prefs.quick}" aria-label="빠르게 체험" data-act="toggleQuick"></button></div>
  </div><div class="dock"><button class="btn sec" data-act="editConditions" style="flex:0 0 38%">조건 수정</button><button class="btn pri" data-act="startPlayer" ${r.moves.length?'':'disabled'}>운동 시작</button></div>`;

/* ---------- 타이머 엔진 (실제 시각 기준 → 백그라운드에서도 정확) ---------- */
let tickId=null,audioCtx=null;
function buildSegs(ids,quick){const segs=[];ids.forEach((id,mi)=>{const m=MOVE[id];segs.push({m:mi,k:'prep',d:quick?Q_PREP:PREP});const w=quick?Q_WORK:m.work;
  if(m.sides){segs.push({m:mi,k:'work',side:'왼쪽',d:w});segs.push({m:mi,k:'switch',d:quick?Q_SWITCH:SWITCH});segs.push({m:mi,k:'work',side:'오른쪽',d:w,last:true});}else segs.push({m:mi,k:'work',side:null,d:w,last:true});});return segs;}
function startPlayer(){
  const c=S.prefs,r=currentRoutine();if(!r||!r.moves.length)return;
  const ids=r.moves.map(m=>m.id),segs=buildSegs(ids,c.quick);
  S.player={sid:uid(),cond:{sport:c.sport,purpose:c.purpose,tools:[...c.tools],minutes:c.minutes,quick:!!c.quick},ids,planned:r.total,segs,i:0,remain:segs[0].d*1000,endAt:null,running:false,activeMs:0,lastTick:null,done:ids.map(()=>false),started:new Date().toISOString(),beeped:-1};
  save();ensureAudio();go('player');plStart();
}
function ensureAudio(){try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC();}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}catch(e){audioCtx=null;}}
function beep(freq=880,dur=0.12){if(!S.prefs.sound||!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(0.15,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}}
function ensureTick(){if(tickId)clearInterval(tickId);tickId=setInterval(onTick,200);} // 중복 실행 방지: 항상 하나만
function stopTick(){if(tickId){clearInterval(tickId);tickId=null;}}
function plStart(){const p=S.player;if(!p||p.running)return;const now=Date.now();p.running=true;p.endAt=now+p.remain;p.lastTick=now;save();ensureTick();render();}
function plPause(){const p=S.player;if(!p||!p.running)return;sync(Date.now());if(!S.player)return;p.remain=Math.max(0,p.endAt-Date.now());p.running=false;p.endAt=null;save();render();}
function sync(now){
  const p=S.player;if(!p||!p.running)return false;
  p.activeMs+=Math.max(0,now-p.lastTick);p.lastTick=now;
  let changed=false;
  while(p.running&&now>=p.endAt){
    const seg=p.segs[p.i];if(seg.k==='work'&&seg.last)p.done[seg.m]=true;
    p.i++;changed=true;
    if(p.i>=p.segs.length){finishPlayer('complete');return true;}
    p.endAt+=p.segs[p.i].d*1000;p.remain=p.endAt-now;
  }
  if(changed){const k=p.segs[p.i].k;beep(k==='work'?1046:660,0.18);flashTimer();}
  return changed;
}
function onTick(){
  const p=S.player;if(!p){stopTick();return;}
  if(!p.running)return;
  const now=Date.now(),changed=sync(now);if(!S.player)return;
  const left=(p.endAt-now)/1000,seg=p.segs[p.i],sec=Math.ceil(left);
  if(seg.k==='work'&&sec<=3&&sec>=1&&p.beeped!==p.i*10+sec){p.beeped=p.i*10+sec;beep(880,0.08);}
  if(changed&&ui.screen==='player')render();else updateTimerDom();
  if(Math.random()<0.25)save();
}
function plJump(mi){
  const p=S.player;if(!p)return;const now=Date.now();if(p.running)sync(now);if(!S.player)return;
  mi=clamp(mi,0,p.ids.length-1);const idx=p.segs.findIndex(s=>s.m===mi);p.i=idx;p.remain=p.segs[idx].d*1000;if(p.running){p.endAt=now+p.remain;p.lastTick=now;}save();render();
}
function finishPlayer(status){
  const p=S.player;if(!p)return;stopTick();
  if(p.running){const now=Date.now();p.activeMs+=Math.max(0,now-p.lastTick);}
  const doneIdx=p.done.map((d,i)=>d?i:-1).filter(i=>i>=0);
  const actual=Math.round(p.activeMs/1000);
  if(status==='partial'&&actual<3&&!doneIdx.length){S.player=null;save();ui.stack=[];ui.screen='routine';render();toast('수행한 시간이 없어 기록하지 않았어요.');return;}
  const rec={id:p.sid,date:p.started,ended:new Date().toISOString(),sport:p.cond.sport,purpose:p.cond.purpose,tools:p.cond.tools,minutes:p.cond.minutes,quick:p.cond.quick,moves:p.ids,total:p.ids.length,doneMoves:doneIdx.length,plannedSec:p.planned,actualSec:actual,status,feel:null,regions:[...new Set(doneIdx.map(i=>MOVE[p.ids[i]].regions[0]))],demo:false};
  const at=S.sessions.findIndex(s=>s.id===rec.id);if(at>=0)S.sessions[at]=Object.assign(S.sessions[at],rec);else S.sessions.push(rec); // 같은 id → 중복 저장 없음
  S.player=null;save();beep(1318,0.35);ui.stack=[];ui.doneId=rec.id;ui.screen='done';render();window.scrollTo(0,0);
}
function flashTimer(){const el=$('#plTimerBox');if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}}
function plView(){
  const p=S.player,now=Date.now();
  const left=p.running?(p.endAt-now)/1000:p.remain/1000;
  const seg=p.segs[p.i],m=MOVE[p.ids[seg.m]];
  const totalMs=p.segs.reduce((s,x)=>s+x.d,0)*1000,doneMs=p.segs.slice(0,p.i).reduce((s,x)=>s+x.d,0)*1000+(seg.d*1000-left*1000);
  const nextSeg=p.segs.slice(p.i+1).find(s=>s.m!==seg.m);
  return {left,seg,m,pct:clamp(doneMs/totalMs*100,0,100),next:nextSeg?MOVE[p.ids[nextSeg.m]]:null};
}
function updateTimerDom(){if(ui.screen!=='player'||!S.player)return;const v=plView(),t=$('#plTime'),b=$('#plBar');if(t){t.textContent=mmss(v.left);t.classList.toggle('warn',v.seg.k==='work'&&v.left<=3&&S.player.running);}if(b)b.style.width=v.pct.toFixed(1)+'%';}
function vPlayer(){
  const p=S.player;if(!p)return vHome();
  const v=plView(),m=v.m,seg=v.seg;
  const status=seg.k==='prep'?'준비하세요':seg.k==='switch'?'반대쪽으로 바꿔요':(seg.side?seg.side+' 수행 중':'수행 중');
  const media=m.video?`<video class="pl-fig" src="${m.video}" autoplay muted loop playsinline style="width:100%"></video>`:animFig(m.poses,m.name+' 동작 도식','pl-fig',430);
  return `<div class="player"><div class="top"><button class="icon-btn" data-act="plExit" aria-label="운동 종료">${I.close}</button><h2>${seg.m+1} / ${p.ids.length} 동작</h2><button class="icon-btn" data-act="toggleSound" aria-label="${S.prefs.sound?'소리 끄기':'소리 켜기'}">${S.prefs.sound?I.sound:I.mute}</button></div>
  <div class="pl-prog" role="progressbar" aria-label="전체 루틴 진행률"><i id="plBar" style="width:${v.pct.toFixed(1)}%"></i></div>
  ${p.cond.quick?'<div style="text-align:center;margin-top:10px"><span class="tag" style="background:#E9D9BF">단축 체험 중 · 실제 시간과 달라요</span></div>':''}
  <div style="position:relative;margin-top:10px">${media}<span class="tag" style="position:absolute;left:10px;top:10px;background:#fff">데모 동작 안내</span>${seg.k!=='work'?`<span class="tag ink" style="position:absolute;right:10px;top:10px">${status}</span>`:''}</div>

function vRecords(){
  const list=[...S.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const week=list.filter(s=>Date.now()-new Date(s.date).getTime()<=7*864e5);
  const totalSec=list.reduce((x,s)=>x+s.actualSec,0);
  let h=`<div class="screen"><div class="top"><span class="logo">WOD</span><button class="icon-btn" data-act="openSettings" aria-label="설정">${I.gear}</button></div><h1>운동 기록</h1>
  <div class="opt-grid" style="margin-bottom:12px"><div class="card" style="margin:0"><div class="small mut">최근 7일 수행</div><div style="font-size:28px;font-weight:900">${week.length}<span class="small"> 회</span></div></div><div class="card" style="margin:0"><div class="small mut">누적 수행 시간</div><div style="font-size:28px;font-weight:900">${Math.floor(totalSec/60)}<span class="small"> 분</span> ${totalSec%60?`<span class="small">${totalSec%60}초</span>`:''}</div></div></div>`;
  if(list.some(s=>s.demo))h+=`<p class="xs mut" style="margin:0 4px 8px">‘데모 기록’ 표시는 예시 사용자의 기록이에요. 요약에도 포함돼요.</p>`;
  if(!list.length)return h+`<div class="card empty"><p class="b" style="margin:0 0 4px">아직 수행 기록이 없어요</p><p class="small mut" style="margin:0 0 16px">루틴을 시작하면 완료·중도 종료 여부와 실제 시간이 저장돼요.</p><button class="btn pri" data-act="startBuilder">루틴 만들기</button></div></div>`+navbar();
  const groups={};list.forEach(s=>{const k=fmtDate(s.date);(groups[k]=groups[k]||[]).push(s);});
  Object.keys(groups).forEach(k=>{h+=`<p class="sec-title small" style="font-size:15px">${k}</p><div class="card" style="padding:4px 20px">${groups[k].map(sessionRow).join('')}</div>`;});
  return h+`</div>`+navbar();
}

/* ---------- 렌더 ---------- */
const VIEWS={intro:vIntro,home:vHome,assess:vAssess,mobility:vMobility,sport:vSport,purpose:vPurpose,tools:vTools,time:vTime,routine:vRoutine,player:vPlayer,done:vDone,records:vRecords,sub:vSub};
function render(){
  if(ui.screen==='player'&&!S.player)ui.screen='home';
  if(ui.screen==='assess'&&!S.draft)ui.screen='home';
  ANIMS={};animId=0;
  const app=$('#app');app.innerHTML=VIEWS[ui.screen]();
  const first=app.firstElementChild;if(first&&lastScreen!==ui.screen)first.classList.add('enter');
  lastScreen=ui.screen;renderLayer();
}
function renderLayer(){
  let h='';
  if(ui.sheet){const body=ui.sheet==='settings'?sheetSettings():ui.sheet.startsWith('a:')?sheetAssessment(ui.sheet.slice(2)):sheetSession(ui.sheet.slice(2));
    h+=`<div class="sheet-bg" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" data-stop="1"><div class="grab"></div>${body}<button class="btn soft" data-act="closeSheet" style="margin-top:12px">닫기</button></div></div>`;}
  h+=modalHtml();
  if(ui.toast)h+=`<div class="toast" role="status">${ui.toast}</div>`;
  $('#layer').innerHTML=h;
}
// 도식 애니메이션 (화면에 보이는 것만, 약 24fps)
let lastAnim=0;
function animLoop(ts){
  if(ts-lastAnim>40){lastAnim=ts;const t=(Math.sin(ts/900)+1)/2,e=t*t*(3-2*t);
    for(const id in ANIMS){const el=document.getElementById(id);if(!el)continue;const ps=ANIMS[id],p=lerp(ps[0],ps[1],e);el.innerHTML=p.k==='top'?svgTop(p):p.k==='back'?svgBack(p):svgBody(p);}}
  requestAnimationFrame(animLoop);
}

/* ---------- 동작(이벤트) ---------- */
function newDraft(opts={}){S.draft={answers:{},angles:{},step:0,isRe:!!opts.isRe,editId:null};save();}
const A={
  back,tab,
  startAssess(){S.onboarded=true;if(!S.draft)newDraft();go('assess');},
  resumeAssess(){go('assess');},
  startReassess(){S.onboarded=true;newDraft({isRe:true});go('assess');toast('이전 기록은 그대로 두고 새 결과로 저장해요.');},
  continueAssess(id){const a=S.assessments.find(x=>x.id===id);if(!a)return;S.draft={answers:Object.assign({},a.answers),angles:Object.assign({},a.angles||{}),step:Math.max(0,TESTS.findIndex(t=>typeof a.answers[t.id]!=='number')),isRe:false,editId:a.id};save();ui.sheet=null;go('assess');},
  assessExit(){ui.modal='exitAssess';renderLayer();},
  doExitAssess(){ui.modal=null;ui.stack=[];ui.screen=S.onboarded?'home':'intro';render();},
  pickLevel(v){const d=S.draft,t=TESTS[d.step];d.answers[t.id]=+v;delete d.angles[t.id];save();render();},
  skipTest(){const d=S.draft,t=TESTS[d.step];d.answers[t.id]='skip';delete d.angles[t.id];save();if(d.step<9){d.step++;save();ui.anglePanel=false;render();window.scrollTo(0,0);}else{render();}},
  toggleAngle(){ui.anglePanel=!ui.anglePanel;const t=TESTS[S.draft.step];ui.angleVal=S.draft.angles[t.id]??Math.round((t.angle.min+t.angle.max)/2);render();},
  applyAngle(){const d=S.draft,t=TESTS[d.step],a=ui.angleVal;d.answers[t.id]=angleToLevel(t,a);d.angles[t.id]=a;ui.anglePanel=false;save();render();},
  assessPrev(){const d=S.draft;if(d.step>0){d.step--;save();ui.anglePanel=false;render();window.scrollTo(0,0);}},
  assessNext(){const d=S.draft;if(d.answers[TESTS[d.step].id]==null)return;
    if(d.step<9){d.step++;save();ui.anglePanel=false;render();window.scrollTo(0,0);return;}
    const rec={id:d.editId||uid(),date:new Date().toISOString(),answers:d.answers,angles:d.angles,demo:false};
    if(d.editId){const i=S.assessments.findIndex(a=>a.id===d.editId);const old=S.assessments[i];rec.demo=!!old.demo;rec.date=old.demo?new Date().toISOString():old.date;if(old.demo)rec.id=uid();if(old.demo)S.assessments.push(rec);else S.assessments[i]=rec;}
    else S.assessments.push(rec);
    S.draft=null;S.onboarded=true;save();ui.stack=[];ui.screen='mobility';render();window.scrollTo(0,0);
    const sc=scoreAssessment(rec);toast(sc.overall!=null?`평가를 저장했어요. 종합 ${sc.overall}점`:'평가를 저장했어요. 건너뛴 항목은 미평가로 표시돼요.');},
  loadDemo(){loadDemo();ui.sheet=null;ui.stack=[];ui.screen='home';render();toast('예시 사용자의 데모 기록을 불러왔어요.');},
  openSettings(){ui.sheet='settings';renderLayer();},
  closeSheet(arg,el,e){if(e&&e.target.closest('[data-stop]')&&!el.closest('.sheet'))return;ui.sheet=null;renderLayer();},
  openSub(){ui.sheet=null;renderLayer();go('sub');},
  openAssessment(id){ui.sheet='a:'+id;renderLayer();},
  openSession(id){ui.sheet='s:'+id;renderLayer();},
  reuseSession(id){const s=S.sessions.find(x=>x.id===id);if(!s)return;Object.assign(S.prefs,{sport:s.sport,purpose:s.purpose,tools:[...s.tools],minutes:s.minutes});save();ui.sheet=null;go('routine');},
  askReset(){ui.modal='reset';renderLayer();},
  doReset(){stopTick();const sound=S.prefs.sound;S=blank();S.prefs.sound=sound;save();ui={screen:'intro',stack:[],sheet:null,modal:null,anglePanel:false,angleVal:null,detail:null,doneId:null,toast:null};render();toast('모든 데이터를 초기화했어요.');},
  closeModal(){ui.modal=null;renderLayer();},
  startBuilder(){S.onboarded=true;go('sport');},
  pickSport(k){S.prefs.sport=k;save();render();setTimeout(()=>{if(ui.screen==='sport')go('purpose');},220);},
  pickPurpose(k){S.prefs.purpose=k;save();render();},
  pickTool(k){let t=S.prefs.tools;if(k==='none')t=t.includes('none')?[]:['none'];else{t=t.filter(x=>x!=='none');t=t.includes(k)?t.filter(x=>x!==k):[...t,k];}S.prefs.tools=t;save();render();},
  pickTime(m){S.prefs.minutes=+m;save();render();},
  stepNext(n){go(n);},
  makeRoutine(){ui.stack=ui.stack.filter(s=>!['sport','purpose','tools','time'].includes(s));go('routine');},
  editConditions(){go('sport');},
  toggleQuick(){S.prefs.quick=!S.prefs.quick;save();render();},
  startPlayer,
  plToggle(){ensureAudio();S.player.running?plPause():plStart();},
  plPrev(){const p=S.player;plJump(p.segs[p.i].m-1);},
  plNext(){const p=S.player,mi=p.segs[p.i].m;if(mi>=p.ids.length-1){ui.modal='exitPlayer';renderLayer();return;}plJump(mi+1);},
  plExit(){ui.modal='exitPlayer';renderLayer();},
  doExitPlayer(){ui.modal=null;finishPlayer('partial');},
  toggleSound(){S.prefs.sound=!S.prefs.sound;save();if(ui.screen==='player')render();else renderLayer();},
  pickFeel(f){const s=S.sessions.find(x=>x.id===ui.doneId);if(!s)return;s.feel=s.feel===f?null:f;save();render();},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.classList.contains('sheet-bg')&&e.target!==el)return; // 시트 내부 클릭은 닫지 않음
  const fn=A[el.dataset.act];if(fn)fn(el.dataset.arg,el,e);
});
document.addEventListener('input',e=>{
  if(e.target.dataset.input!=='angle')return;const t=TESTS[S.draft.step],a=+e.target.value;ui.angleVal=a;
  $('#angNum').textContent=a;$('#angLvl').textContent='범위 '+angleToLevel(t,a);
  $('#angGauge').innerHTML=gauge(a,t.angle);$('#angFig').innerHTML=svgPose(t.pose(a),'입력한 각도의 자세').replace('<svg','<svg class="fig"');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(ui.sheet||ui.modal)){ui.sheet=null;ui.modal=null;renderLayer();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.player&&S.player.running){const c=sync(Date.now());if(S.player){save();ui.screen==='player'&&(c?render():updateTimerDom());}}else if(document.hidden&&S.player)save();});
window.addEventListener('pagehide',save);

/* ---------- 시작 ---------- */
// 새로고침 시 진행 중이던 루틴은 그 자리에서 일시정지 상태로 복원
if(S.player&&S.player.running){const p=S.player;p.remain=Math.max(0,Math.min(p.segs[p.i].d*1000,(p.endAt||Date.now())-Date.now()))||p.segs[p.i].d*1000;p.running=false;p.endAt=null;save();}
render();requestAnimationFrame(animLoop);
window.WOD={S:()=>S,recommend,scoreAssessment,TESTS,MOVES,demoData,moveSec,REGION_KEYS};
</script>
